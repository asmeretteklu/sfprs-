<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Receipts — SFPRS Student Portal</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-badge">
        <div class="logo-icon">M</div>
        <div class="logo-text"><strong>SFPRS</strong><span>Microlink IT College</span></div>
      </div>
    </div>
    <div class="sidebar-section-label">Student Portal</div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="index.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a class="nav-item" href="register.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>Registration</a>
      <a class="nav-item" href="pay.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Pay Fees</a>
      <a class="nav-item active" href="receipts.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16l4-2 4 2 4-2 4 2V8z"/></svg>Receipts</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="user-info"><strong class="user-name">—</strong><span class="user-role">Student</span></div>
        <button id="logoutBtn" title="Sign out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <h2>My Receipts</h2>
        <p class="text-muted text-sm">All payment receipts — click to download PDF</p>
      </div>
    </header>

    <div class="page-content fade-up">
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">Payment History</div>
            <div class="card-subtitle" id="receiptCount">Loading...</div>
          </div>
          <div class="search-bar" style="width:240px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Search receipt no...">
          </div>
        </div>

        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>Receipt No.</th>
                <th>Fee Description</th>
                <th>Amount</th>
                <th>Method</th>
                <th>Date</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="receiptsBody">
              <tr><td colspan="7"><div class="shimmer" style="height:44px;border-radius:4px"></div></td></tr>
            </tbody>
          </table>
        </div>

        <div class="pagination" id="pagination"></div>
      </div>

      <!-- Summary -->
      <div class="stats-grid mt-4">
        <div class="stat-card mint">
          <div class="stat-icon">💵</div>
          <div class="stat-label">Total Paid</div>
          <div class="stat-value" id="sumTotal">—</div>
          <div class="stat-meta">ETB all time</div>
        </div>
        <div class="stat-card mustard">
          <div class="stat-icon">🧾</div>
          <div class="stat-label">Receipts</div>
          <div class="stat-value" id="sumCount">—</div>
          <div class="stat-meta">Payment records</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../shared/auth.js"></script>
<script src="../shared/api.js"></script>
<script>
if (!AUTH.requireRole('student')) void 0;
AUTH.injectSidebarUser();
LANG.init();

const user = AUTH.getUser();
let allReceipts = [];
let currentPage = 1;
const PAGE_SIZE  = 10;

async function loadReceipts() {
  try {
    const data = await API.finance(`/payments?studentId=${user.id}&limit=100`);
    allReceipts = data.data || [];
    render();

    // Compute totals
    const total = allReceipts.reduce((s, r) => s + parseFloat(r.amount_paid || 0), 0);
    document.getElementById('sumTotal').textContent  = fmtCurrency(total);
    document.getElementById('sumCount').textContent  = allReceipts.length;
    document.getElementById('receiptCount').textContent = `${allReceipts.length} receipt${allReceipts.length === 1 ? '' : 's'}`;
  } catch (err) {
    document.getElementById('receiptsBody').innerHTML =
      `<tr><td colspan="7"><div class="alert alert-error">${err.message}</div></td></tr>`;
  }
}

function render() {
  const query    = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allReceipts.filter(r =>
    !query ||
    r.receipt_number?.toLowerCase().includes(query) ||
    r.fee_name?.toLowerCase().includes(query)
  );
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  const slice      = filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  const tbody = document.getElementById('receiptsBody');
  if (!slice.length) {
    tbody.innerHTML = `<tr><td colspan="7">
      <div class="empty-state"><div class="empty-state-icon">🧾</div><h3>No receipts found</h3></div>
    </td></tr>`;
  } else {
    tbody.innerHTML = slice.map(r => `
      <tr>
        <td class="td-mono" style="color:var(--mustard)">${r.receipt_number || '—'}</td>
        <td class="td-primary">${r.fee_name || '—'}</td>
        <td style="font-weight:700;color:var(--mint)">${fmtCurrency(r.amount_paid)}</td>
        <td>${(r.payment_method || '').replace(/_/g,' ').toUpperCase()}</td>
        <td>${fmtDateTime(r.payment_date)}</td>
        <td>${statusBadge(r.status)}</td>
        <td>
          ${r.receipt_number ? `
            <button class="btn btn-secondary btn-sm" onclick="downloadFile('${SERVICES.finance}/api/finance/receipts/${r.id}/download','${r.receipt_number}.pdf')">
              ⬇ PDF
            </button>
          ` : '—'}
        </td>
      </tr>
    `).join('');
  }

  // Pagination
  const pag = document.getElementById('pagination');
  pag.innerHTML = '';
  for (let p = 1; p <= totalPages; p++) {
    const btn = document.createElement('button');
    btn.className = `page-btn${p === currentPage ? ' active' : ''}`;
    btn.textContent = p;
    btn.onclick = () => { currentPage = p; render(); };
    pag.appendChild(btn);
  }
}

document.getElementById('searchInput').addEventListener('input', () => { currentPage = 1; render(); });

loadReceipts();
</script>
</body>
</html>
