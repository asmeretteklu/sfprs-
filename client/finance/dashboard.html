<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Dashboard — SFPRS</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-badge">
        <div class="logo-icon">M</div>
        <div class="logo-text"><strong>SFPRS</strong><span>Finance Office</span></div>
      </div>
    </div>
    <div class="sidebar-section-label">Finance Portal</div>
    <nav class="sidebar-nav">
      <a class="nav-item active" href="dashboard.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a class="nav-item" href="payments.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Record Payment</a>
      <a class="nav-item" href="ledger.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16l4-2 4 2 4-2 4 2V8z"/></svg>Ledger</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="user-info"><strong class="user-name">—</strong><span class="user-role">Finance Officer</span></div>
        <button id="logoutBtn" title="Sign out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-header">
      <div class="header-title">
        <h2 id="greeting">Finance Dashboard</h2>
        <p class="text-muted text-sm" id="dateLabel">—</p>
      </div>
      <div class="topbar-actions">
        <a href="payments.html" class="btn btn-primary btn-sm">+ Record Payment</a>
      </div>
    </header>

    <div class="content-body fade-up delay-1">
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:20px; margin-bottom:24px;">
        <div class="panel" style="display:flex; flex-direction:column; align-items:center; justify-content:center;">
          <h3 class="text-muted text-sm">Today's Collection</h3>
          <h2 id="todayTotal" style="font-size:2.5rem; color:var(--mint);">--</h2>
          <div class="stat-meta text-xs text-muted"><span id="todayCount">--</span> payments</div>
        </div>
        <div class="panel" style="display:flex; flex-direction:column; align-items:center; justify-content:center;">
          <h3 class="text-muted text-sm">This Month</h3>
          <h2 id="monthTotal" style="font-size:2.5rem;">--</h2>
          <div class="stat-meta text-xs text-muted"><span id="monthCount">--</span> payments</div>
        </div>
        <div class="panel" style="display:flex; flex-direction:column; align-items:center; justify-content:center; border: 1px solid var(--rose);">
          <h3 class="text-muted text-sm">Overdue Students</h3>
          <h2 id="overdueCount" style="font-size:2.5rem; color:var(--rose);">--</h2>
        </div>
      </div>

      <div class="grid-2 gap-4">
        <!-- Recent payments -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">Recent Payments</div>
            <a href="ledger.html" class="btn btn-ghost btn-sm">Full Ledger</a>
          </div>
          <div id="recentPaymentsList">
            <div class="shimmer" style="height:50px;margin-bottom:8px;border-radius:6px"></div>
            <div class="shimmer" style="height:50px;margin-bottom:8px;border-radius:6px"></div>
            <div class="shimmer" style="height:50px;border-radius:6px"></div>
          </div>
        </div>

        <!-- Overdue alert list -->
        <div class="card">
          <div class="card-header">
            <div class="card-title" style="color:var(--persian)">⚠ Overdue Students</div>
            <a href="ledger.html" class="btn btn-ghost btn-sm">Send Warning</a>
          </div>
          <div id="overdueList">
            <div class="shimmer" style="height:50px;margin-bottom:8px;border-radius:6px"></div>
            <div class="shimmer" style="height:50px;border-radius:6px"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../shared/auth.js"></script>
<script src="../shared/api.js"></script>
<script>
if (!AUTH.requireRole('finance_officer', 'super_admin')) void 0;
AUTH.injectSidebarUser();
LANG.init();

document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('en-ET', { dateStyle: 'full' });
document.getElementById('greeting').textContent = AUTH.getGreeting() + ' — Finance Dashboard';

async function loadDashboard() {
  try {
    const data = await API.finance('/dashboard');
    document.getElementById('todayTotal').textContent  = fmtCurrency(data.today.total);
    document.getElementById('todayCount').textContent  = data.today.count;
    document.getElementById('monthTotal').textContent  = fmtCurrency(data.month.total);
    document.getElementById('monthCount').textContent  = data.month.count;
    document.getElementById('overdueCount').textContent = data.overdue.students;

    const rpEl = document.getElementById('recentPaymentsList');
    if (!data.recentPayments?.length) {
      rpEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💳</div><h3>No payments today</h3></div>';
    } else {
      rpEl.innerHTML = data.recentPayments.map(p => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)">
          <div>
            <div style="font-weight:500;font-size:0.875rem">${p.first_name} ${p.last_name}</div>
            <div class="text-xs text-muted font-mono">${p.receipt_number || '—'} · ${p.payment_method?.replace(/_/g,' ')}</div>
          </div>
          <div style="text-align:right">
            <div style="font-weight:700;color:var(--mint);font-size:0.9rem">${fmtCurrency(p.amount_paid)}</div>
            <div class="text-xs text-muted">${fmtDateTime(p.payment_date)}</div>
          </div>
        </div>
      `).join('');
    }
  } catch (err) {
    toast('Failed to load dashboard: ' + err.message, 'error');
  }
}

async function loadOverdue() {
  try {
    const data = await API.finance('/overdue');
    const el = document.getElementById('overdueList');
    if (!data.data?.length) {
      el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✅</div><h3>No overdue students</h3></div>';
    } else {
      el.innerHTML = data.data.slice(0, 6).map(s => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)">
          <div>
            <div style="font-weight:500;font-size:0.875rem">${s.first_name} ${s.last_name}</div>
            <div class="text-xs text-muted">${s.student_id_number} · ${s.department}</div>
          </div>
          <div style="text-align:right">
            <div style="font-weight:700;color:var(--persian);font-size:0.85rem">${fmtCurrency(s.total_overdue)}</div>
            <div class="badge badge-overdue">Overdue</div>
          </div>
        </div>
      `).join('');
    }
  } catch {}
}

loadDashboard();
loadOverdue();
</script>
</body>
</html>
